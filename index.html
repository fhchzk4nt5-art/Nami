<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>関東波チェック</title>
<meta name="description" content="茨城・千葉・湘南の22サーフポイントの波・風・潮・混雑をひと目でチェックできる無料アプリ">
<meta name="theme-color" content="#0B2733">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="波チェック">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* Layout: a deep-sea app bar over a pale tide sheet. Answer first (verdict, today's pick, one card per coast), then one-line spot rows; a spot opens as its own full screen. */
:root {
  --bg: #EDF2F3; --surface: #FFFFFF; --surface2: #F3F7F8; --ink: #0B2230; --muted: #546E78; --faint: #8DA0A8; --line: #D5DFE3;
  --bar: #0B2733; --bar-ink: #F2F8F9; --bar-muted: rgba(242, 248, 249, .66); --bar-line: rgba(242, 248, 249, .16); --bar-soft: rgba(242, 248, 249, .08); --bar-wave: #6FD3E0; --bar-off: #FFB48A;
  --deep: #0D3A48; --deep-ink: #F4FAFB; --deep-muted: rgba(244, 250, 251, .74); --deep-soft: rgba(244, 250, 251, .1); --deep-wave: rgba(111, 211, 224, .22); --deep-line: rgba(111, 211, 224, .55);
  --deep-good: #4AD6A7; --deep-okay: #9AD67F; --deep-fair: #F2C252; --deep-poor: #B3C1C6; --deep-bad: #FF8F85; --deep-danger: #FF6B6B;
  --accent: #E0590F; --accent-soft: rgba(224, 89, 15, .12);
  --sea: #0B7285; --sea-soft: rgba(11, 114, 133, .14); --night: rgba(11, 34, 48, .07); --moon: #D19A1F;
  --good: #0A8A68; --okay: #3E8F36; --fair: #A97404; --poor: #74858C; --bad: #B8382F; --danger: #C1121F;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061218; --surface: #0D1F27; --surface2: #112731; --ink: #E2ECEF; --muted: #93A9B2; --faint: #5D7580; --line: #1D3540;
    --bar: #0A1B23; --bar-ink: #E8F1F3; --bar-muted: rgba(232, 241, 243, .64); --bar-line: rgba(232, 241, 243, .12); --bar-soft: rgba(232, 241, 243, .06);
    --deep: #0F3543; --deep-soft: rgba(244, 250, 251, .08);
    --accent: #FF7D3A; --accent-soft: rgba(255, 125, 58, .16);
    --sea: #3EC1D0; --sea-soft: rgba(62, 193, 208, .17); --night: rgba(0, 0, 0, .3); --moon: #F2D27A;
    --good: #35C99B; --okay: #86C76E; --fair: #E2B23F; --poor: #8C9EA6; --bad: #EE6F67; --danger: #FF5A5F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061218; --surface: #0D1F27; --surface2: #112731; --ink: #E2ECEF; --muted: #93A9B2; --faint: #5D7580; --line: #1D3540;
  --bar: #0A1B23; --bar-ink: #E8F1F3; --bar-muted: rgba(232, 241, 243, .64); --bar-line: rgba(232, 241, 243, .12); --bar-soft: rgba(232, 241, 243, .06);
  --deep: #0F3543; --deep-soft: rgba(244, 250, 251, .08);
  --accent: #FF7D3A; --accent-soft: rgba(255, 125, 58, .16);
  --sea: #3EC1D0; --sea-soft: rgba(62, 193, 208, .17); --night: rgba(0, 0, 0, .3); --moon: #F2D27A;
  --good: #35C99B; --okay: #86C76E; --fair: #E2B23F; --poor: #8C9EA6; --bad: #EE6F67; --danger: #FF5A5F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; padding-bottom: env(safe-area-inset-bottom, 0px); }
html.lock, html.lock body { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6; font-feature-settings: "palt" 1;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
button { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.t-good { --tone: var(--good); } .t-okay { --tone: var(--okay); } .t-fair { --tone: var(--fair); }
.t-poor { --tone: var(--poor); } .t-bad { --tone: var(--bad); } .t-danger { --tone: var(--danger); } .t-none { --tone: var(--faint); }

/* ---------- app bar ---------- */
.bar { position: sticky; top: 0; z-index: 6; background: var(--bar); color: var(--bar-ink); padding-top: env(safe-area-inset-top, 0px); }
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px 8px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand .name { font-family: var(--font-display); font-size: 19px; letter-spacing: .03em; white-space: nowrap; }
.logo-sun { fill: var(--accent); }
.logo-wave { fill: none; stroke: var(--bar-wave); stroke-width: 2.6; stroke-linecap: round; }
.meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
  font-size: 11.5px; color: var(--bar-muted); border: 1px solid var(--bar-line); white-space: nowrap;
}
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--deep-good); flex: none; }
.pill.stale i { background: var(--deep-fair); }
.pill.none i { background: var(--bar-muted); }
.pill.busy i { background: var(--bar-wave); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
.refresh-btn {
  border: 1px solid var(--bar-line); background: var(--bar-soft); color: var(--bar-ink); border-radius: 999px; padding: 3px 11px;
  font-size: 11.5px; cursor: pointer; white-space: nowrap;
}
.refresh-btn:disabled { opacity: .55; cursor: default; }
.days { display: flex; gap: 6px; overflow-x: auto; padding-block: 0 12px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.day {
  flex: 0 0 auto; min-width: 58px; display: grid; justify-items: center; padding: 5px 8px; border-radius: 10px; cursor: pointer;
  background: var(--bar-soft); border: 1px solid var(--bar-line); color: var(--bar-ink); line-height: 1.25;
}
.day b { font-size: 13.5px; }
.day small { font-size: 10.5px; color: var(--bar-muted); }
.day small.off { color: var(--bar-off); }
.day .dm { font-size: 13px; font-weight: 700; min-height: 1.2em; }
.day[aria-selected="true"] { background: var(--bar-ink); border-color: var(--bar-ink); color: var(--bar); }
.day[aria-selected="true"] small { color: inherit; opacity: .75; }

main.wrap { display: grid; gap: 26px; padding-block: 16px 56px; }
.sec { margin: 0 0 10px; font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 700; }

/* ---------- install hint ---------- */
.install {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 14px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line);
}
.install img { width: 40px; height: 40px; border-radius: 10px; }
.install p { margin: 0; font-size: 13px; line-height: 1.5; }
.install p b { display: block; font-size: 14px; }
.install .acts { display: grid; gap: 6px; justify-items: end; }
.install button { border: 0; border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.install .go { background: var(--accent); color: #fff; }
.install .no { background: transparent; color: var(--muted); padding: 2px 4px; }

/* ---------- verdict + sky ---------- */
.verdict { margin: 0 0 12px; font-size: 16.5px; line-height: 1.65; max-width: 40em; text-wrap: pretty; }
.verdict b { font-weight: 700; }
.sky {
  display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); align-items: center; gap: 10px 14px;
  padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.sky svg { width: 32px; height: 32px; }
.moon-dark { fill: var(--line); }
.moon-lit { fill: var(--moon); }
.fact { display: grid; min-width: 0; }
.fact b { font-size: 16px; line-height: 1.35; }
.fact small { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; }

/* ---------- grade, wind, crowd ---------- */
.grade {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-weight: 700; font-size: 18px; line-height: 1; color: var(--tone); background: var(--surface2); border: 1.5px solid var(--tone);
}
@supports (background: color-mix(in srgb, red 10%, transparent)) {
  .grade { background: color-mix(in srgb, var(--tone) 13%, transparent); border-color: color-mix(in srgb, var(--tone) 50%, transparent); }
}
.grade.sm { width: 26px; height: 26px; font-size: 14px; }
.w { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.w svg.arw { width: 15px; height: 15px; fill: var(--tone); flex: none; }
.w .rel { color: var(--tone); font-weight: 700; }
.when { color: var(--muted); font-size: 11.5px; }
.cr { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; color: var(--tone); font-weight: 700; }
.cr svg { width: 15px; height: 15px; fill: currentColor; flex: none; }
.bars { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 12px; flex: none; }
.bars i { display: block; width: 3px; border-radius: 1px; background: var(--line); }
.bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 6px; } .bars i:nth-child(3) { height: 8px; }
.bars i:nth-child(4) { height: 10px; } .bars i:nth-child(5) { height: 12px; }
.bars i.on { background: var(--tone); }
.tag {
  display: inline-block; font-size: 10.5px; font-weight: 700; line-height: 1.5; padding: 0 7px; border-radius: 999px;
  color: var(--tone); border: 1px solid var(--tone); white-space: nowrap;
}

/* ---------- hero ---------- */
.hero {
  --good: var(--deep-good); --okay: var(--deep-okay); --fair: var(--deep-fair); --poor: var(--deep-poor); --bad: var(--deep-bad); --danger: var(--deep-danger);
  position: relative; overflow: hidden; display: grid; gap: 2px; color: var(--deep-ink);
  background: var(--deep); border-radius: 22px; padding: 18px 18px 22px;
}
.hero > * { position: relative; }
.hero-tide { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 84px; pointer-events: none; }
.hero-tide path { fill: var(--deep-wave); stroke: none; }
.hero-tide polyline { fill: none; stroke: var(--deep-line); stroke-width: 1.5; }
.hero .eyebrow { margin: 0; font-size: 12px; letter-spacing: .14em; color: var(--deep-muted); font-weight: 700; }
.hero-head { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.hero .grade { background: var(--deep-ink); border-color: var(--deep-ink); }
.hero-head .word { font-weight: 700; color: var(--tone); }
.hero h3 { margin: 8px 0 0; font-size: 22px; line-height: 1.3; }
.hero h3 small { font-size: 13px; color: var(--deep-muted); font-weight: 400; margin-left: 8px; }
.hero-size { font-family: var(--font-display); font-size: clamp(36px, 11vw, 54px); line-height: 1.1; margin: 6px 0 10px; letter-spacing: .02em; word-break: keep-all; overflow-wrap: anywhere; }
.hero-line { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13.5px; margin: 0; }
.hero-line .when { color: var(--deep-muted); }
.hero .bars i { background: var(--deep-soft); }
.hero .bars i.on { background: var(--tone); }
.hero-meta { margin: 8px 0 0; font-size: 13px; color: var(--deep-muted); }
.hero-open {
  justify-self: start; margin-top: 14px; border: 0; background: var(--deep-ink); color: var(--deep); border-radius: 999px;
  padding: 7px 16px; font-size: 13.5px; cursor: pointer; font-weight: 700;
}
.note-card { padding: 16px; border-radius: var(--radius); border: 1px dashed var(--line); background: var(--surface); color: var(--muted); font-size: 14px; }
.note-card b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 15px; }
.note-card button { margin-top: 10px; border: 0; border-radius: 999px; padding: 6px 14px; font-weight: 700; background: var(--ink); color: var(--bg); cursor: pointer; }

/* ---------- coast cards ---------- */
.agrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.acard {
  display: grid; gap: 3px; align-content: start; text-align: left; cursor: pointer; padding: 12px 12px 13px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0;
}
.acard .a-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.acard .a-name { font-weight: 700; font-size: 15px; }
.acard .a-spot { font-size: 12px; color: var(--muted); }
.acard .a-size { font-family: var(--font-display); font-size: 17px; line-height: 1.35; margin-top: 2px; word-break: keep-all; overflow-wrap: anywhere; }
.acard .a-row { font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.acard.dim { opacity: .75; }

/* ---------- filters + rows ---------- */
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
.chip-sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }
.groups { display: grid; gap: 22px; }
.ghead { display: grid; gap: 6px; margin-bottom: 8px; }
.ghead h3 { margin: 0; font-size: 18px; line-height: 1.3; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ghead h3 small { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.jma { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.jma b { color: var(--ink); }
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.rows li + li { border-top: 1px solid var(--line); }
.row {
  width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 12px; grid-template-areas: "g n s c" "g m m c";
  gap: 4px 12px; align-items: center; padding: 11px 12px; background: transparent; border: 0; text-align: left; cursor: pointer;
}
.row > .grade { grid-area: g; }
.row .r-name { grid-area: n; min-width: 0; font-weight: 700; font-size: 16px; line-height: 1.35; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .r-name .fav { color: var(--accent); font-size: 13px; }
.row .r-size { grid-area: s; font-family: var(--font-display); font-size: 15.5px; line-height: 1.3; white-space: nowrap; }
.row .r-meta { grid-area: m; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 12px; min-width: 0; }
.row .r-go { grid-area: c; color: var(--faint); font-size: 20px; line-height: 1; }
.empty { padding: 16px; font-size: 14px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------- spot screen ---------- */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--bg); }
.sheet-bar { flex: none; background: var(--bar); color: var(--bar-ink); padding-top: env(safe-area-inset-top, 0px); }
.sheet-bar-in { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-block: 8px; }
.back { border: 0; background: transparent; color: var(--bar-ink); font-weight: 700; font-size: 15px; cursor: pointer; padding: 6px 4px; }
.sheet-day { font-size: 13px; color: var(--bar-muted); }
.fav-top { border: 1px solid var(--bar-line); background: var(--bar-soft); color: var(--bar-ink); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.fav-top[aria-pressed="true"] { color: var(--bar-off); border-color: var(--bar-off); }
.sheet-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-body { display: grid; gap: 18px; padding-block: 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
.sp-head { display: grid; gap: 2px; }
.sp-area { margin: 0; font-size: 12.5px; color: var(--muted); }
.sp-head h2 { margin: 0; font-size: 26px; line-height: 1.25; }
.sp-verdict { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.sp-verdict .word { font-weight: 700; color: var(--tone); }
.sp-size { font-family: var(--font-display); font-size: clamp(34px, 10vw, 48px); line-height: 1.12; margin: 6px 0 2px; word-break: keep-all; overflow-wrap: anywhere; }
.sp-sub { margin: 0; font-size: 13.5px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.dlabel { font-size: 12.5px; color: var(--muted); letter-spacing: .08em; font-weight: 700; margin: 0 0 8px; }
.dlabel .nowtxt { color: var(--accent); }
.hchart { display: block; width: 100%; height: auto; }
.hchart .night { fill: var(--night); }
.hchart .guide { stroke: var(--line); stroke-dasharray: 3 3; fill: none; }
.hchart .glab { fill: var(--muted); font-size: 10px; font-weight: 700; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.hchart .hbar { fill: var(--tone); }
.hchart .hbar.dim { opacity: .35; }
.hchart .axis { fill: var(--muted); font-family: var(--font-data); font-size: 10.5px; }
.hchart .ws { fill: var(--muted); font-family: var(--font-data); font-size: 10px; }
.hchart .warr { fill: var(--tone); }
.hchart .now { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
.hchart .rowlab { fill: var(--muted); font-size: 10px; font-weight: 700; }
.legend-row { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.legend-row span { display: inline-flex; align-items: center; gap: 4px; }
.legend-row i { width: 10px; height: 10px; border-radius: 2px; background: var(--tone); display: inline-block; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wk {
  display: grid; justify-items: center; gap: 1px; padding: 7px 2px 8px; border-radius: 10px; cursor: pointer; min-width: 0;
  background: var(--surface2); border: 1px solid transparent; font-size: 11px; line-height: 1.3;
}
.wk b { font-size: 12px; }
.wk .wm { font-size: 17px; font-weight: 700; color: var(--tone); }
.wk .wsz { font-family: var(--font-display); font-size: 10.5px; text-align: center; word-break: keep-all; overflow-wrap: anywhere; }
.wk[aria-current="true"] { border-color: var(--ink); background: var(--surface); }
.wk small.off { color: var(--accent); }
.windsum { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 14px; align-items: center; }
.compass { width: 116px; height: 116px; display: block; }
.c-land { fill: var(--surface2); stroke: var(--line); stroke-width: 1; }
.c-sea { fill: var(--sea-soft); stroke: none; }
.c-beach { stroke: var(--sea); stroke-width: 2.5; stroke-linecap: round; fill: none; }
.c-lab { font-size: 12px; font-weight: 700; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.c-lab.sea { fill: var(--sea); }
.c-n { font-size: 10px; fill: var(--faint); }
.c-tick { stroke: var(--faint); stroke-width: 1.2; }
.c-arrow { stroke: var(--tone); stroke-width: 4; stroke-linecap: round; fill: none; }
.c-head { fill: var(--tone); }
.ws-main { margin: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    r.extremes.forEach(function (e) {
      var x = X(e.t), y = Y(e.z), hiType = e.type === 'high', lx = Math.min(W - R - 42, Math.max(L + 42, x));
      s += '<circle class="dot" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4"/>';
      s += '<text class="lab" x="' + lx.toFixed(1) + '" y="' + (hiType ? y - 9 : y + 17).toFixed(1) + '" text-anchor="middle">' + (hiType ? '満 ' : '干 ') + hm(e.t) + ' ' + Math.round(e.z) + '</text>';
    });
    if (C.jstKey(state.now) === day) {
      var xn = X(state.now), yn = Y(C.tideAt(spot.tide, state.now));
      s += '<line class="now" x1="' + xn.toFixed(1) + '" x2="' + xn.toFixed(1) + '" y1="' + T + '" y2="' + (H - B) + '"/><circle class="nowdot" cx="' + xn.toFixed(1) + '" cy="' + yn.toFixed(1) + '" r="5"/>';
    }
    var aria = r.extremes.map(function (e) { return (e.type === 'high' ? '満潮' : '干潮') + hm(e.t) + '（' + Math.round(e.z) + 'cm）'; }).join('、');
    return '<svg class="tide" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="潮位グラフ ' + aria + '">' + s + '</svg>';
  }
  function tideNowText(spot, day) {
    if (day !== todayKey()) return '';
    var z = C.tideAt(spot.tide, state.now), z2 = C.tideAt(spot.tide, state.now + 15 * 60000);
    return ' <span class="nowtxt">● いま <span class="num">' + Math.round(z) + 'cm</span>・' + (z2 >= z ? '上げ潮' : '下げ潮') + '</span>';
  }
  function renderSheet(day) {
    var sheet = document.getElementById('sheet');
    var s = state.open && SPOT_BY_ID[state.open];
    if (!s) { if (!sheet.hidden) { sheet.hidden = true; document.documentElement.classList.remove('lock'); } return; }
    var ev = evalFor(s, day), grp = GROUP_BY_ID[s.group], isFav = state.favs.indexOf(s.id) >= 0;
    var b = ev.best, g = ev.grade, lv = b ? C.levelGuideHb(b.hb) : null;
    var focus = b || ev.hours.filter(function (h) { return h.daylight && !h.past; })[0] || null;
    var L = C.lunarInfo(day), sun = C.sunTimes(day, s.lat, s.lon), st = C.STATIONS[s.tide];
    var sst = focus && focus.sst != null ? focus.sst : C.seaTemp(WATER[s.group], day);
    var W = (document.getElementById('sheetbody').clientWidth || Math.min(760, window.innerWidth) - 32) - 30;
    var windy = 'https://www.windy.com/?waves,' + s.lat.toFixed(3) + ',' + s.lon.toFixed(3) + ',11';
    var jmaUrl = 'https://www.jma.go.jp/bosai/forecast/#area_type=class10s&area_code=' + s.area;
    var warnUrl = 'https://www.jma.go.jp/bosai/warning/#area_type=offices&area_code=' + grp.pref;
    var tideUrl = 'https://www.data.jma.go.jp/kaiyou/db/tide/suisan/suisan.php?stn=' + s.tide;
    var camUrl = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(s.cam);

    document.getElementById('sheetbar').innerHTML =
      '<button class="back" data-action="close" id="sheet-back">‹ 一覧</button>' +
      '<span class="sheet-day">' + dayName(day) + (day === todayKey() || day === C.addDays(todayKey(), 1) ? ' ' + md(day) + '(' + wd(day) + ')' : '') + '</span>' +
      '<button class="fav-top" data-action="fav" data-id="' + s.id + '" aria-pressed="' + isFav + '">' + (isFav ? '★ 登録済み' : '☆ お気に入り') + '</button>';

    var head = '<header class="sp-head t-' + (g ? g.tone : 'none') + '">' +
      '<p class="sp-area">' + esc(grp.name) + '・' + esc(s.town) + '</p><h2 id="sheet-title">' + esc(s.name) + '</h2>' +
      (g ? '<div class="sp-verdict"><span class="grade">' + g.mark + '</span><span class="word">' + g.word + '</span>' + (lv ? '<span class="tag t-' + lv.tone + '">' + lv.label + '</span>' : '') + '</div>' : '') +
      '<p class="sp-size">' + (b ? sizeHTML(b.hb) : (ev.ended ? '日中は終了' : 'データなし')) + '</p>' +
      '<p class="sp-sub">' + (b ? whenWord(b, day) + 'がいちばん良さそう ・ ' + esc(swellText(b)) : '') + '</p></header>';

    var wind;
    if (focus && focus.wd != null) {
      var rel = focus.rel ? C.REL[focus.rel] : null;
      wind = '<section class="card"><div class="windsum t-' + relTone(focus.rel) + '">' + compassSvg(s.facing, focus) + '<div>' +
        '<p class="dlabel">' + whenWord(focus, day) + 'の風</p>' +
        '<p class="ws-main">' + C.dir8(focus.wd) + 'の風 <span class="num">' + Math.round(focus.ws) + 'm/s</span>' + bars(focus.level) + '</p>' +
        (focus.wg != null ? '<p class="ws-desc">最大瞬間 <span class="num">' + Math.round(focus.wg) + 'm/s</span>' + (focus.code != null ? ' ・ ' + C.wmoText(focus.code) : '') + (focus.temp != null ? ' ・ 気温 ' + Math.round(focus.temp) + '℃' : '') + '</p>' : '') +
        (rel ? '<p class="ws-rel">' + rel.label + '</p><p class="ws-desc">' + rel.desc + '</p>' : '') + '</div></div></section>';
    } else {
      wind = '<section class="card"><div class="windsum">' + compassSvg(s.facing, null) + '<div><p class="dlabel">風</p><p class="ws-desc">この時間帯の風のデータはありません。</p></div></div></section>';
    }
    var crowd = focus && focus.crowd ? '<section class="card"><p class="dlabel">混雑</p><div class="crowd-main t-' + focus.crowd.tone + '">' + people(focus.crowd.n) + '<b>' + focus.crowd.label + '</b><small>（' + (focus.crowd.off ? '土日祝' : '平日') + '・' + whenWord(focus, day) + 'の予想）</small></div>' +
      '<p class="crowd-note">曜日・時間帯・波のよさ・ポイントの人気・季節・天気から出した目安です。実際の様子はライブカメラで確かめてください。</p></section>' : '';
    var jmaDoc = state.jma[grp.pref], ad = jmaDoc ? C.areaDay({ pref: state.jma, wind: {} }, grp.pref, s.area, day) : null;

    document.getElementById('sheetbody').innerHTML = head +
      '<section class="card"><p class="dlabel">1時間ごとの波と風</p>' + hourChart(ev, day, W) + '</section>' +
      '<section><p class="dlabel">7日間</p>' + weekStrip(s, day) + '</section>' +
      wind +
      '<section class="card"><p class="dlabel">潮位（' + esc(st.name) + '・推算）' + tideNowText(s, day) + '</p>' + tideSvg(s, day, W) + '</section>' +
      crowd +
      '<section class="card"><p class="dlabel">ポイント情報</p><dl class="facts">' +
      '<div><dt>海岸の向き</dt><dd>' + C.dir8(s.facing) + '向き<small>' + C.dir8(s.facing - 45) + '〜' + C.dir8(s.facing + 45) + 'のうねりが入る</small></dd></div>' +
      '<div><dt>オフショアになる風</dt><dd>' + C.dir8(s.facing + 180) + '寄りの風<small>陸から海へ吹く向き</small></dd></div>' +
      '<div><dt>日の出 / 日の入</dt><dd class="num">' + C.hmFromMin(sun.rise) + ' / ' + C.hmFromMin(sun.set) + '</dd></div>' +
      '<div><dt>潮回り</dt><dd>' + L.tideName + '<small>月齢 ' + L.age.toFixed(1) + '</small></dd></div>' +
      '<div><dt>水温</dt><dd>約' + Math.round(sst) + '℃<small>' + C.wetsuit(sst) + '</small></dd></div>' +
      '<div><dt>波の周期</dt><dd>' + (b && b.tp != null ? Math.round(b.tp) + '秒' : '—') + '<small>' + (b && b.tp != null ? (b.tp >= 10 ? '長めのうねりで力がある' : b.tp >= 7 ? 'ふつう' : '短い風波でまとまりにくい') : '') + '</small></dd></div>' +
      '</dl></section>' +
      (ad && ad.waves ? '<section><p class="dlabel">気象庁の予報（' + esc(JMA_AREA[s.area]) + '）</p><p class="jma-raw"><b>波</b> ' + esc(ad.waves.text) + '<br><b>風</b> ' + esc(ad.wind.text || '—') + '<br><b>天気</b> ' + esc(ad.weather || '—') + '</p></section>' : '') +
      '<div class="actions">' +
      '<a href="' + camUrl + '" target="_blank" rel="noopener">ライブカメラを探す ↗</a>' +
      '<a href="' + warnUrl + '" target="_blank" rel="noopener">波浪注意報・警報 ↗</a>' +
      '<a href="' + jmaUrl + '" target="_blank" rel="noopener">気象庁の予報 ↗</a>' +
      '<a href="' + windy + '" target="_blank" rel="noopener">Windy ↗</a>' +
      '<a href="' + tideUrl + '" target="_blank" rel="noopener">潮位表 ↗</a></div>' +
      '<p class="model-note">波・風・水温は数値モデルの計算値（Open-Meteo）で、予報ではありません。大きな誤差を含むことがあります。</p>';

    if (sheet.hidden) {
      sheet.hidden = false;
      document.documentElement.classList.add('lock');
      document.getElementById('sheetscroll').scrollTop = 0;
      var back = document.getElementById('sheet-back'); if (back) back.focus({ preventScroll: true });
      if (W < 300) requestAnimationFrame(render); // first paint measured a hidden sheet; redraw at real width
    }
  }

  var focusKey = null;
  function render() {
    var day = currentDay();
    var evals = SPOTS.map(function (s) { return evalFor(s, day); });
    renderMeta();
    renderDays(day);
    renderInstall();
    renderSummary(day, evals);
    renderPicks(day, evals);
    renderCoasts(day, evals);
    renderChips();
    renderGroups(day, evals);
    renderAbout();
    renderSheet(day);
    if (focusKey) { var el = document.querySelector(focusKey); if (el) el.focus({ preventScroll: true }); focusKey = null; }
  }

  /* ---------- interactions ---------- */
  function closeSpot() {
    var id = state.open;
    state.open = null;
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    render();
    var row = id && document.getElementById('row-' + id);
    if (row) { row.focus({ preventScroll: true }); row.scrollIntoView({ block: 'nearest' }); }
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-action]');
    if (!t) return;
    var a = t.getAttribute('data-action');
    if (a === 'day') { state.day = t.getAttribute('data-day'); focusKey = (state.open ? '#sheetbody ' : '#days ') + '[data-day="' + state.day + '"]'; render(); }
    else if (a === 'filter') {
      state.filter = t.getAttribute('data-filter'); store.set('filter', state.filter); render();
      if (t.classList.contains('acard')) { var list = document.getElementById('list'); if (list) list.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
      else focusKey = '#chips [data-filter="' + state.filter + '"]';
    }
    else if (a === 'spot') { state.open = t.getAttribute('data-id'); history.replaceState(null, '', '#' + state.open); render(); }
    else if (a === 'close') closeSpot();
    else if (a === 'fav') {
      var fid = t.getAttribute('data-id'), i = state.favs.indexOf(fid);
      if (i >= 0) state.favs.splice(i, 1); else state.favs.push(fid);
      store.set('favs', state.favs);
      focusKey = '#sheetbar [data-action="fav"]';
      render();
    }
    else if (a === 'refresh') load(true);
    else if (a === 'install' && state.installPrompt) {
      var p = state.installPrompt; state.installPrompt = null;
      p.prompt(); p.userChoice.then(function () { render(); }, function () { render(); });
    }
    else if (a === 'install-hide') { state.installHidden = true; store.set('installHidden', true); render(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.open) closeSpot(); });
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); state.installPrompt = e; render(); });
  window.addEventListener('appinstalled', function () { state.installHidden = true; render(); });
  window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); state.open = SPOT_BY_ID[h] ? h : null; render(); });
  window.addEventListener('online', function () { load(false); });

  var hash = (location.hash || '').replace('#', '');
  if (SPOT_BY_ID[hash]) state.open = hash;
  render();
  load(false);
  loadJMA();
  setInterval(function () {
    if (document.hidden) return;
    var before = C.jstKey(state.now);
    state.now = Date.now();
    evalCache = {};
    if (C.jstKey(state.now) !== before) tideCache = {};
    render();
  }, 60000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    state.now = Date.now();
    evalCache = {};
    if (!state.fetchedAt || Date.now() - state.fetchedAt > MAX_AGE) load(false); else render();
  });
  var rz = null, lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (Math.abs(window.innerWidth - lastW) < 8) return;
    lastW = window.innerWidth;
    clearTimeout(rz); rz = setTimeout(render, 150);
  });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache unavailable */ }); });
  }
})();
</script>
</body>
</html>
